name: Bug Report
description: Create a report to help us improve Envault
labels: ["bug"]
assignees:
  - DinanathDash
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false
  - type: input
    id: desktop_os
    attributes:
      label: OS (Desktop)
      description: e.g., macOS, Windows, Linux
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser
      description: e.g., Chrome, Safari, Firefox
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: e.g., v1.0.0
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
    validations:
      required: false
