<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>Password Changed</title>
    <style>
      /* Reset */
      body {
        margin: 0;
        padding: 0;
        background-color: #f4f4f5;
        font-family:
          -apple-system, BlinkMacMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #18181b;
      }

      table {
        border-spacing: 0;
        width: 100%;
      }

      td {
        padding: 0;
      }

      img {
        border: 0;
      }

      .wrapper {
        width: 100%;
        table-layout: fixed;
        background-color: #f4f4f5;
        padding: 60px 0;
      }

      .main {
        background-color: #ffffff;
        margin: 0 auto;
        width: 96%;
        max-width: 540px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 20px -1px rgba(0, 0, 0, 0.08);
        border: 1px solid #e4e4e7;
      }

      .header {
        padding: 40px 48px 32px;
        text-align: center;
      }

      .logo {
        text-decoration: none;
        color: #18181b;
        display: inline-block;
        line-height: 0;
      }

      .logo img {
        display: block;
        width: 214px;
        max-width: 100%;
        height: auto;
      }

      .body {
        padding: 0 48px 48px 48px;
      }

      .heading {
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 20px;
        color: #18181b;
        line-height: 1.3;
        letter-spacing: -0.5px;
        text-align: left;
      }

      .text {
        font-size: 16px;
        line-height: 1.6;
        color: #52525b;
        margin: 0 0 24px;
        text-align: left;
      }

      .btn-container {
        margin: 32px 0;
        text-align: left;
      }

      .btn {
        display: inline-block;
        background-color: #18181b;
        color: #ffffff;
        font-size: 15px;
        font-weight: 500;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 10px;
        transition: opacity 0.2s;
        text-align: center;
      }

      .btn:hover {
        opacity: 0.9;
      }

      .footer {
        padding: 32px 48px;
        text-align: center;
        background-color: #fafafa;
        border-top: 1px solid #e4e4e7;
      }

      .footer-text {
        font-size: 13px;
        color: #a1a1aa;
        line-height: 1.6;
        margin: 0;
      }
      @media (prefers-color-scheme: dark) {
        .logo {
          color: #ffffff !important;
        }
      }

      [data-ogsc] .logo {
        color: #ffffff !important;
      }

      @media only screen and (max-width: 600px) {
        .wrapper {
          padding: 20px 0;
        }

        .header {
          padding: 32px 24px 24px;
        }

        .body {
          padding: 0 24px 32px;
        }

        .heading {
          font-size: 22px;
        }

        .text {
          font-size: 15px;
        }

        .btn {
          width: 100%;
          box-sizing: border-box;
        }
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <table role="presentation">
        <tr>
          <td align="center">
            <div class="main">
              <div class="header">
                <img
                  src="https://www.envault.tech/email-logo.png"
                  alt="Envault"
                  width="214"
                  height="78"
                  style="
                    display: block;
                    width: 214px;
                    height: auto;
                    max-width: 100%;
                    margin: 0 auto;
                  "
                />
              </div>
              <div class="body">
                <h1 class="heading">Password Changed</h1>
                <p class="text">
                  This is a confirmation that the password for your Envault
                  account was recently changed.
                </p>
                <p class="text">
                  If you did not make this change, please contact our support
                  team immediately to secure your account.
                </p>
                <div class="btn-container">
                  <a href="{{ .SiteURL }}" class="btn">Go to Dashboard</a>
                </div>
              </div>
              <div class="footer">
                <p class="footer-text">
                  &copy; Envault. All rights reserved.<br />
                  Secure Environment Variables Management
                </p>
              </div>
            </div>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
